<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1512">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="U11 Draft">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* podstawowy reset (na claude.ai robi to otoczka strony) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#0c1512}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Ultimate 11 Draft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: pasek portfela na górze, pod nim jeden widok naraz (menu, draft, skład, mecz, koniec). Boisko po lewej, panel po prawej, na telefonie jedno pod drugim. */
:root{
  --bg:#0c1512; --panel:#14211c; --panel2:#1b2c25; --line:#2b4237;
  --fg:#eaf1ea; --mute:#8fa89a; --gold:#e9b949; --gold-ink:#2a1e00;
  --pitch-a:#17603a; --pitch-b:#1a6a40; --chalk:rgba(234,241,234,.55);
  --good:#58d68d; --bad:#ef6a5b; --mut:#ff6fb1;
  --bronze-a:#c98a58; --bronze-b:#8a5532; --silver-a:#dfe5ea; --silver-b:#97a3ad;
  --gold-a:#f4cf62; --gold-b:#b98a1d; --rare-a:#ffe38a; --rare-b:#2fb5a3;
  --toty-a:#2f63ff; --toty-b:#0d1f6b; --icon-a:#fff6dc; --icon-b:#d9b66a;
  --font-d:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --font-b:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-b);padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.slot:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-transform:uppercase;letter-spacing:.04em;text-wrap:balance}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{font:800 26px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase}
.brand b{background:var(--gold);color:var(--gold-ink);padding:0 7px;border-radius:3px;margin:0 4px}
.wallet{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pill b{font:700 17px/1 var(--font-d);color:var(--gold)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font:700 18px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;padding:12px 22px}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--mut);color:#2a0016;font:700 12px/18px var(--font-b);text-align:center;margin-left:6px;padding:0 5px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* menu */
.hero{padding:10px 0 22px}
.hero h1{font-size:clamp(40px,8vw,76px);line-height:.95;font-weight:800}
.hero p{max-width:56ch;color:var(--mute);margin:12px 0 0}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.form:hover{border-color:var(--gold)}
.form .nm{font:700 24px/1 var(--font-d);letter-spacing:.05em;margin-top:8px}
.mini-pitch{position:relative;aspect-ratio:3/4;background:linear-gradient(var(--pitch-a),var(--pitch-b));border-radius:8px;border:1px solid var(--line)}
.mini-pitch i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--fg);transform:translate(-50%,-50%)}
/* pitch */
.pitch{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:7/9;border-radius:12px;border:2px solid var(--chalk);overflow:hidden;
  background:repeating-linear-gradient(0deg,var(--pitch-a) 0 11.11%,var(--pitch-b) 11.11% 22.22%)}
.pitch::before{content:"";position:absolute;left:50%;top:0;width:56%;height:16%;transform:translateX(-50%);border:2px solid var(--chalk);border-top:0}
.pitch::after{content:"";position:absolute;left:50%;bottom:0;width:56%;height:16%;transform:translateX(-50%);border:2px solid var(--chalk);border-bottom:0}
.pitch .mid{position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--chalk)}
.pitch .circ{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid var(--chalk);border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;width:17%;transform:translate(-50%,-50%);background:none;border:0;padding:0;z-index:2}
.slot.empty .ph{aspect-ratio:3/4;border:2px dashed var(--chalk);border-radius:8px;display:grid;place-items:center;font:700 14px var(--font-d);letter-spacing:.05em;background:rgba(0,0,0,.18)}
.slot.ok .ph{border-color:var(--gold);color:var(--gold);background:rgba(233,185,73,.18);animation:pulse 1.1s ease-in-out infinite}
.slot.sel .card{outline:2px solid var(--gold);outline-offset:2px}
.slot .pen{position:absolute;top:-7px;right:-4px;background:var(--bad);color:#2b0500;font:700 11px/1 var(--font-b);padding:2px 4px;border-radius:4px;z-index:3}
@keyframes pulse{50%{transform:scale(1.05)}}
/* cards */
.card{--a:var(--gold-a);--b:var(--gold-b);--ink:#2a1e00;position:relative;border-radius:10px;background:linear-gradient(155deg,var(--a),var(--b));color:var(--ink);padding:8px 8px 7px;text-align:left;display:block;width:100%;border:0;min-width:0;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.t-bronze{--a:var(--bronze-a);--b:var(--bronze-b);--ink:#2a1405}
.t-silver{--a:var(--silver-a);--b:var(--silver-b);--ink:#1b2127}
.t-gold{--a:var(--gold-a);--b:var(--gold-b);--ink:#2a1e00}
.t-rare{--a:var(--rare-a);--b:var(--rare-b);--ink:#0b2a26}
.t-toty{--a:var(--toty-a);--b:var(--toty-b);--ink:#f3d878}
.t-icon{--a:var(--icon-a);--b:var(--icon-b);--ink:#3b2a05}
.card .ovr{font:800 34px/.9 var(--font-d)}
.card .cpos{font:700 14px/1 var(--font-d);letter-spacing:.06em;display:block;margin-top:3px}
.card .nm{font:700 15px/1.05 var(--font-d);text-transform:uppercase;letter-spacing:.03em;margin-top:8px;min-height:2.1em;overflow-wrap:break-word}
.card .meta{font-size:11px;font-weight:600;opacity:.8;margin-top:4px;display:flex;justify-content:space-between;gap:4px}
.card .tier{position:absolute;top:8px;right:8px;font:700 10px/1 var(--font-d);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.card .mut{display:block;margin-top:6px;background:var(--mut);color:#2a0016;font:700 11px/1 var(--font-b);padding:3px 5px;border-radius:4px;text-align:center}
.card.mini{padding:4px 4px 3px;border-radius:6px}
.card.mini .ovr{font-size:clamp(15px,3.6vw,22px)}
.card.mini .cpos{font-size:10px;margin-top:1px}
.card.mini .nm{font-size:clamp(8px,1.9vw,11px);margin-top:3px;min-height:0;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.mini .tier,.card.mini .meta{display:none}
.card.mini .mutdot{position:absolute;top:-4px;left:-4px;width:12px;height:12px;border-radius:50%;background:var(--mut);border:2px solid var(--bg)}
.pack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
@media(max-width:640px){.pack{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pack3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
@media(max-width:820px){.gpitch{order:1}.gctl{order:2}}
.pack{perspective:900px}
.pack .card{cursor:pointer;transition:transform .15s;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px))}
.pack.fresh .card{animation:flipc .62s var(--d,0s) backwards}
.pack .card:nth-child(2){animation-delay:.07s}.pack .card:nth-child(3){animation-delay:.14s}.pack .card:nth-child(4){animation-delay:.21s}.pack .card:nth-child(5){animation-delay:.28s}
.pack .card:hover{--ty:-4px}
.pack .card.sel{outline:3px solid var(--fg);outline-offset:2px;--ty:-6px}
@keyframes deal{from{opacity:0;transform:translateY(18px) rotateX(40deg)}to{opacity:1;transform:none}}
.roll{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.roll .big{font:800 clamp(30px,6vw,46px)/1 var(--font-d);text-transform:uppercase;letter-spacing:.04em}
.roll .big.yr{color:var(--gold)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--gold)}
/* stats */
.lines{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.lines div{background:var(--panel2);border-radius:8px;padding:8px 6px;text-align:center}
.lines b{display:block;font:700 26px/1 var(--font-d);font-variant-numeric:tabular-nums}
.lines span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.chem{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chem span{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px}
.chem span.on{border-color:var(--gold);color:var(--gold)}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.stages span{font:700 13px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:6px;background:var(--panel2);color:var(--mute)}
.stages span.now{background:var(--gold);color:var(--gold-ink)}
.stages span.done{color:var(--good)}
/* match */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.score .tm{font:700 clamp(18px,4vw,26px)/1.1 var(--font-d);text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.score .res{font:800 clamp(44px,10vw,76px)/1 var(--font-d);font-variant-numeric:tabular-nums}
.clock{text-align:center;font:700 18px var(--font-d);color:var(--gold);letter-spacing:.1em;margin:4px 0}
.log{max-height:300px;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.log div{display:flex;gap:10px;font-size:14px;padding:6px 8px;background:var(--panel2);border-radius:6px}
.log .m{font:700 15px var(--font-d);color:var(--mute);min-width:34px}
.log .g{background:rgba(88,214,141,.14);border-left:3px solid var(--good)}
.log .ga{background:rgba(239,106,91,.14);border-left:3px solid var(--bad)}
.banner{font:800 clamp(34px,7vw,60px)/1 var(--font-d);text-transform:uppercase;letter-spacing:.04em}
.banner.win{color:var(--gold)}.banner.lose{color:var(--bad)}
/* quests */
.modal{position:fixed;inset:0;background:rgba(5,10,8,.8);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px}
.modal>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:640px;width:100%}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.q h3{font-size:19px}
.q .prog{grid-column:1/-1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.q .prog i{display:block;height:100%;background:var(--good)}
.q.claimed{opacity:.5}
.rw{font:700 15px var(--font-d);color:var(--gold);letter-spacing:.05em;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:600;padding:10px 18px;border-radius:8px;z-index:60;max-width:calc(100% - 32px)}

.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.tact{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:130px}
.ball{position:absolute;width:3.4%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd6cf 60%,#8a948c);transform:translate(-50%,-50%);transition:left .38s ease-in-out,top .38s ease-in-out;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.slot.act .card{outline:3px solid #fff;transform:scale(1.18);transition:transform .15s}
.gflash{position:absolute;inset:38% 0 auto 0;text-align:center;font:800 clamp(40px,12vw,80px)/1 var(--font-d);color:var(--gold);text-shadow:0 3px 14px rgba(0,0,0,.7);z-index:6;animation:pop .5s both;text-transform:uppercase}
.gflash.bad{color:var(--bad)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.lineup{display:grid;gap:3px}
.lineup div{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;font-size:13px;padding:3px 6px;background:var(--panel2);border-radius:5px}
.lineup div span:first-child{color:var(--mute);font:700 13px var(--font-d);letter-spacing:.05em}
.lineup b{font:700 15px var(--font-d)}

.t-wc{--a:#d6405a;--b:#43101f;--ink:#ffe9a8}
.t-euro{--a:#3fc8da;--b:#0c3567;--ink:#ffffff}
.card .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 4px;margin-top:6px;padding-top:5px;border-top:1px solid color-mix(in srgb,var(--ink) 30%,transparent);font-size:10px;font-weight:500}
.card .stats b{font:700 13px var(--font-d)}
.card .mut.dupb{background:#1c1c1c;color:#fff}
.pack .card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.selbox{margin-top:12px;padding:10px 12px;background:var(--panel2);border-radius:8px;border:1px solid var(--line)}
.slot.hov .ph{background:rgba(233,185,73,.4);transform:scale(1.1)}
.ghost{position:fixed;width:76px;pointer-events:none;z-index:90;transform:translate(-50%,-60%) rotate(-4deg);opacity:.96;left:-200px;top:-200px}
.walk{position:fixed;inset:0;z-index:80;background:rgba(3,6,5,.93);display:grid;place-items:center;align-content:center;gap:18px;cursor:pointer;animation:fadein .3s both}
.wo-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(244,207,98,.45),transparent 55%);animation:glow 1.6s ease-out both}
.wo-card{position:relative;width:min(230px,62vw);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
.wo-card .card{box-shadow:0 0 60px rgba(244,207,98,.6)}
.wo-txt{position:relative;text-align:center;font:700 22px/1.2 var(--font-d);text-transform:uppercase;letter-spacing:.12em;color:var(--gold);animation:fadein 1s .5s both}
.wo-txt b{color:var(--fg);font-size:30px}
@keyframes rise{from{transform:translateY(60px) scale(.6) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:8px 14px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--gold);color:var(--gold-ink)}
.panel.daily{border-color:var(--gold);background:linear-gradient(120deg,var(--panel),var(--panel2))}
.tbl{display:grid;gap:3px;margin:6px 0 12px}
.tr{display:grid;grid-template-columns:24px minmax(0,1fr) 28px 54px 34px;gap:8px;align-items:center;padding:5px 8px;background:var(--panel2);border-radius:6px;font-size:13px;text-align:left}
.tr.th{background:none;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tr.me{outline:1px solid var(--gold);color:var(--gold)}
.tr span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr b{font:700 16px var(--font-d);text-align:right;font-variant-numeric:tabular-nums}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.ach div{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:3px;opacity:.5}
.ach div.on{opacity:1;border:1px solid var(--gold)}
.ach b{font:700 17px var(--font-d);letter-spacing:.04em;text-transform:uppercase}
details.hd{border-top:1px solid var(--line);padding:10px 0}
details.hd summary{cursor:pointer;font-size:14px}
details.hd .lineup{margin-top:8px}

/* ===== v5: wygląd, animacje, losowanie ===== */
body{background:radial-gradient(900px 420px at 50% -140px,rgba(233,185,73,.13),transparent 65%),radial-gradient(600px 400px at 100% 30%,rgba(23,96,58,.18),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn{transition:transform .12s,border-color .15s,background .15s,filter .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 40%),var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#app.enter>*{animation:viewin .45s cubic-bezier(.2,.8,.2,1) backwards}
#app.enter>*:nth-child(2){animation-delay:.06s}#app.enter>*:nth-child(3){animation-delay:.12s}
@keyframes viewin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal>div{animation:modalin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes modalin{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.toast{animation:toastin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translateX(-50%)}}
/* karty */
.card{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 4px 12px rgba(0,0,0,.45);overflow:hidden}
.card:not(.mini)::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.09) 0 5px,transparent 5px 11px);pointer-events:none}
.card:not(.mini)::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 46%,transparent 62%);background-size:260% 100%;background-position:160% 0;pointer-events:none;mix-blend-mode:soft-light;transition:background-position .7s;z-index:2}
.card:not(.mini):hover::after{background-position:-60% 0}
.card.t-icon:not(.mini){background:linear-gradient(120deg,#fff6dc,#e9c97e 30%,#fff6dc 50%,#d9b66a 70%,#fff6dc);background-size:300% 300%;animation:foil 5s linear infinite}
.card.t-toty:not(.mini)::before{background:radial-gradient(circle at 20% 20%,rgba(244,216,120,.4) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(244,216,120,.35) 0 2px,transparent 3px),radial-gradient(circle at 40% 85%,rgba(244,216,120,.3) 0 2px,transparent 3px),repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 5px,transparent 5px 11px)}
@keyframes foil{to{background-position:300% 300%}}
.pack.fresh .card.t-icon:not(.mini){animation:flipc .62s var(--d,0s) backwards,foil 5s linear infinite}

  const up=opts.up||{},co={rare:UPFX.rare(up.rare||0),mut:UPFX.mut(up.mut||0)};
  let wantI=RNG()<UPFX.icon(up.icon||0),wantT=!wantI&&RNG()<UPFX.toty(up.toty||0);
  for(let t=0;t<400;t++){
    const country=opts.country||pick(CODES);
    if(!opts.country&&opts.avoidCountry&&country===opts.avoidCountry&&t<120)continue;
    let year=MINY+rnd(MAXY-MINY+1);
    if(opts.avoidYear&&year===opts.avoidYear)continue;
    const pool=PLAYERS.filter(p=>p.c===country&&p.from<=year&&year<=p.to&&((p.g==='GK')?need.gk:need.field));
    const min=t<150?5:t<280?3:1;
    if(pool.length<min)continue;
    if(wantI&&t<300&&!pool.some(p=>p.peak>=86))continue;
    let ch=shuffle(pool).slice(0,5);
    if(need.gk&&need.forceGK&&!ch.some(p=>p.g==='GK')){const gk=pool.filter(p=>p.g==='GK');if(gk.length)ch[0]=pick(gk);}
    const force={};
    const slotFor=()=>{const ix=ch.map((p,i)=>i).filter(i=>ch[i].g!=='GK'&&!force[i]);return ix.length?pick(ix):rnd(ch.length);};
    if(wantI){
      const el=ch.map((p,i)=>p.peak>=86?i:-1).filter(i=>i>=0);let ii=-1;
      if(el.length)ii=pick(el);
      else{const c2=pool.filter(p=>p.peak>=86&&!ch.includes(p));if(c2.length){ii=slotFor();ch[ii]=pick(c2);}}
      if(ii>=0)force[ii]='icon';else if(t<300)continue;
    }
    if(wantT){const ii=slotFor();force[ii]='toty';}
    const cards=ch.map((p,i)=>makeCard(p,year,{force:force[i],rare:co.rare,mut:co.mut}));
    if(soft<4&&Math.max.apply(null,cards.map(c=>c.ovr))<72){soft++;continue;}
    return {country,year,cards};
  }
  return null;
}
function penalty(slotPos,card){
  if((slotPos==='GK')!==(card.pos==='GK'))return 99;
  if(card.mut==='wild')return 0;
  if(slotPos===card.pos)return 0;
  if((NEIGH[slotPos]||[]).includes(card.pos))return 3;
  if(GROUP[slotPos]===GROUP[card.pos])return 8;
  return 15;
}
function chemBonus(n){return n>=7?3:n>=5?2:n>=3?1:0;}
function countryCounts(slots){const m={};let cap=0;slots.forEach(s=>{if(s.card){m[s.card.c]=(m[s.card.c]||0)+1;if(s.card.mut==='captain')cap++;}});Object.defineProperty(m,'cap',{value:cap,enumerable:false});return m;}
function eff(slot,cc,ko){
  const c=slot.card;if(!c)return 0;
  let v=c.ovr-penalty(slot.pos,c)+chemBonus(cc[c.c]||0);
  if(ko&&c.mut==='clutch')v+=4;
  if(cc.cap)v+=Math.min(2,cc.cap-(c.mut==='captain'?1:0));
  if(INJ.has(c))v-=10;
  return Math.max(30,v);
}
function ratings(slots,ko){
  const cc=countryCounts(slots);
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
  const gk=[],df=[],md=[],at=[],all=[];
  slots.forEach(s=>{const e=eff(s,cc,ko);all.push(e);const g=GROUP[s.pos];(g==='GK'?gk:g==='DEF'?df:g==='MID'?md:at).push(e);});
  return {gk:avg(gk),def:avg(df),mid:avg(md),att:avg(at),ovr:avg(all)};
}

  const p=M.phase;let h='';
  if(p==='pre'){
    h='<h3>Taktyka na pierwszą połowę</h3>'+tactBtns()+'<p class="small mute">'+hintText()+'</p><div class="fastbar" style="margin-top:0"><button class="btn pri" data-act="m-go">Gwizdek, start</button><button class="btn" data-act="m-skipall">Pomiń do końca</button></div>';
  }else if(p==='h1'||p==='h2'){
    h='<div class="row" style="justify-content:space-between"><span class="small mute">Taktyka: '+TACT[M.tactic].n+'</span><span class="row" style="gap:8px"><button class="btn" data-act="m-skip">Pomiń połowę</button><button class="btn pri" data-act="m-skipall">Pomiń do końca</button></span></div>';
  }else if(p==='ht'){
    h='<h3>Przerwa. Wynik '+M.gf+':'+M.ga+'</h3><p class="small mute">'+hintText()+'</p>'+tactBtns()+'<div class="fastbar"><button class="btn pri" data-act="m-go">Druga połowa</button><button class="btn" data-act="m-skipall">Pomiń do końca</button></div>';
  }else if(p==='pens'){
    h=pensHTML();
  }else if(p==='done'){
    h='<button class="btn pri" data-act="next" id="nx">'+(M.next==='squad'?'Do składu':'Podsumowanie')+'</button>';
  }
  c.innerHTML=h;
}
/* ----- połowa ----- */
function runHalf(h){
  const lo=h===1?1:46,hi=h===1?45:90,o=S.opp;
  M.phase='h'+h;M.hi=hi;M.cur=lo-1;
  const _old=RNG;if(S.daily)RNG=mulberry(S.daily.seed+S.stage*977+h*13);
  const my=tmod(M.my,M.tactic);
  const gf=poisson(muOf(my.att,my.mid,o.def,o.mid,o.gk)/2),ga=poisson(muOf(o.att,o.mid,my.def,my.mid,my.gk)/2);
  const mins=n=>{const a=[];let g=0;while(a.length<n&&g++<200){const m=lo+rnd(hi-lo+1);if(!M.used.has(m)){M.used.add(m);a.push(m);}}return a;};
  const myW=S.slots.map((s,i)=>({i,w:(SCW[s.pos]||1)*Math.pow(eff(s,M.cc,M.ko)/80,3)*Math.pow(statsOf(s.card)[1]/80,2)}));
  const ev=[];
  mins(gf).forEach(m=>{const w=wpick(myW);ev.push({min:m,side:'h',type:'goal',si:w.i,text:'GOL! '+S.slots[w.i].card.n+' ('+S.slots[w.i].pos+')'});});
  mins(ga).forEach(m=>{const nm=RNG()<.5?pick(S.opp.stars):pick(S.opp.pool);ev.push({min:m,side:'a',type:'goal',si:gkIndex(),text:'Gol dla rywali: '+nm});});
  const gk=S.slots[gkIndex()].card.n;
  mins(2+rnd(2)).forEach(m=>{
    if(RNG()<.55){const w=wpick(myW),n=S.slots[w.i].card.n;ev.push({min:m,side:'h',type:'chance',si:w.i,text:pick([n+' uderza, piłka tuż obok słupka.',n+' w dobrej sytuacji, ale bramkarz rywali łapie piłkę.',n+' trafia w poprzeczkę!'])});}
    else ev.push({min:m,side:'a',type:'chance',si:gkIndex(),text:pick([pick(S.opp.stars)+' próbuje z dystansu, '+gk+' broni.','Rzut rożny dla rywali, '+gk+' pewnie łapie piłkę.',pick(S.opp.stars)+' pudłuje z kilku metrów.'])});
  });
  M.ev=ev;RNG=_old;
  if(h===1)logLine('',1,'Początek meczu.');else logLine('',46,'Zaczyna się druga połowa.');
  renderCtl();sfx('whistle');
  M.timer=setTimeout(tick,500);
}
function doEvent(e,fast){
  if(e.type==='goal'){if(e.side==='h')M.gf++;else M.ga++;const s=$('#sc');if(s)s.textContent=M.gf+':'+M.ga;}
  logLine(e.type==='goal'?(e.side==='h'?'g':'ga'):'',e.min,e.text);
  if(fast)return;
  if(e.side==='h'){
    const p=slotPos(e.si);lightSlot(e.si);setBall(p[0],p[1]);
    later(()=>setBall(40+rnd(21),e.type==='goal'?3:9),380);
    if(e.type==='goal')later(()=>{flash('GOL!');sfx('goal');goalFx(true);},700);
  }else{
    const gi=gkIndex(),p=slotPos(gi);
    setBall(25+rnd(51),68);
    later(()=>setBall(40+rnd(21),e.type==='goal'?97:90),380);
    if(e.type==='goal')later(()=>{flash('Gol rywali',true);sfx('concede');goalFx(false);},700);else{later(()=>lightSlot(gi),380);}
  }
}
function tick(){
  M.cur++;
  const evs=M.ev.filter(e=>e.min===M.cur);
  const clk=$('#clk');if(clk)clk.textContent=M.cur+'\'';
  evs.forEach(e=>doEvent(e,false));
  if(!evs.length){const att=Math.random()<.5;setBall(15+rnd(71),att?20+rnd(30):50+rnd(30));}
  if(M.cur>=M.hi){endHalf();return;}
  const goal=evs.some(e=>e.type==='goal'),ch=evs.length;
  M.timer=setTimeout(tick,goal?1500:ch?950:140);
}
function fastHalf(){
  clearTimeout(M.timer);M.to.forEach(clearTimeout);M.to=[];
  while(M.cur<M.hi){M.cur++;M.ev.filter(e=>e.min===M.cur).forEach(e=>doEvent(e,true));}
  const clk=$('#clk');if(clk)clk.textContent=M.hi+'\'';
  endHalf();
}
function endHalf(){
  clearTimeout(M.timer);sfx('whistle');
  if(M.phase==='h1'){M.phase='ht';logLine('',45,'Przerwa. Wynik '+M.gf+':'+M.ga+'.');setBall(50,50);renderCtl();}
  else{
    logLine('',90,'Koniec regulaminowego czasu: '+M.gf+':'+M.ga+'.');
    if(M.ko&&M.gf===M.ga)startPens();else finishMatch(null);
  }
}
/* ----- karne ----- */
function startPens(){
  const sh=S.slots.filter(s=>s.pos!=='GK').map(s=>s.card).sort((a,b)=>statsOf(b)[1]-statsOf(a)[1]);
  M.phase='pens';M.pen={a:0,b:0,na:0,nb:0,turn:'me',sh,hist:[]};
  logLine('',0,'Remis. Rzuty karne!');renderCtl();setBall(50,78);
}
function penEnded(p){
  const ra=Math.max(0,5-p.na),rb=Math.max(0,5-p.nb);
  if(p.na<=5&&p.nb<=5&&!(p.na===5&&p.nb===5))return p.a>p.b+rb||p.b>p.a+ra;
  return p.na===p.nb&&p.a!==p.b;
}
function pensHTML(){
  const p=M.pen;
  const dots=p.hist.map(x=>'<span style="color:'+(x.g?'var(--good)':'var(--bad)')+'">'+(x.g?'●':'○')+'</span>').join(' ');
  let who,txt;
  if(p.turn==='me'){const s=p.sh[p.na%p.sh.length];who='Strzelasz: '+s.n+' (STR '+statsOf(s)[1]+')';txt='Wybierz, w który róg kopniesz.';}
  else{who='Rywal strzela: '+pick(S.opp.stars);txt='Wybierz, w którą stronę rzuci się twój bramkarz.';}
  return '<h3>Rzuty karne: '+p.a+':'+p.b+'</h3><div style="font-size:20px;letter-spacing:.2em;margin:4px 0">'+dots+'</div><p><b>'+esc(who)+'</b><br><span class="small mute">'+txt+'</span></p><div class="row">'+DIRS.map((d,i)=>'<button class="btn" data-act="m-pk" data-d="'+i+'">'+d+'</button>').join('')+'<button class="btn" data-act="m-auto">Auto do końca</button></div>';
}
function penStep(choice){
  const _o=RNG;
  if(S.daily&&M.pen)RNG=mulberry(S.daily.seed+S.stage*31+M.pen.na*17+M.pen.nb*5+(M.pen.turn==='me'?1:2));
  try{penStep0(choice);}finally{RNG=_o;}
}
function penStep0(choice){
  const p=M.pen;let goal,line;
  if(p.turn==='me'){
    const s=p.sh[p.na%p.sh.length],kd=rnd(3),miss=Math.max(.04,.14-(statsOf(s)[1]-75)/250);
    goal=kd===choice?RNG()>(.8+(S.opp.gk-80)/400):RNG()>miss;
    p.na++;if(goal)p.a++;
    line=s.n+(goal?' strzela gola ('+DIRS[choice].toLowerCase()+').':(kd===choice?' strzela, ale bramkarz broni.':' strzela obok bramki.'));
    p.turn='opp';
  }else{
    const od=rnd(3),sv=.7+(statsOf(S.slots[gkIndex()].card)[0]-80)/300;
    goal=od===choice?RNG()>sv:RNG()<.91;
    p.nb++;if(goal)p.b++;
    line='Rywal '+(goal?'trafia do siatki.':'nie trafia, twój bramkarz broni.');
    p.turn='me';
  }
  sfx(goal?'goal':'save');p.hist.push({g:goal});logLine(goal?(p.turn==='opp'?'g':'ga'):'',0,line);
  const bx=40+rnd(21);setBall(bx,p.turn==='opp'?4:96);
  if(penEnded(p)){M.phase='pens-done';later(()=>finishMatch({a:p.a,b:p.b}),700);renderCtl();return;}
  renderCtl();
}
/* ----- koniec ----- */
function simQuick(A,B){
  return [poisson(muOf(A.att,A.mid,B.def,B.mid,B.gk)),poisson(muOf(B.att,B.mid,A.def,A.mid,A.gk))];
}
function finishMatch(pens){
  if(!M||M.phase==='done')return;
  M.to.forEach(clearTimeout);clearTimeout(M.timer);
  const ko=M.ko,gf=M.gf,ga=M.ga;
  const win=gf>ga||(pens&&pens.a>pens.b),draw=!ko&&gf===ga;
  if(pens)logLine('',0,'Karne: '+pens.a+':'+pens.b+'.');
  logLine('',0,'Koniec meczu: '+gf+':'+ga+'.');
  INJ.clear();
  if(win){S.slots.forEach(s=>{const c=s.card;if(c.mut==='young'&&(c.grow||0)<5){c.ovr++;c.grow=(c.grow||0)+1;addStat('grown',1);logLine('',0,c.n+' rozwija się: '+c.ovr+' OVR.');}});}
  addStat('matches',1);addStat('goals',gf);if(win)addStat('wins',1);if(ga===0)addStat('clean',1);if(gf-ga>=3)addStat('big',1);
  S.hist=S.hist||[];S.hist.push({stage:S.stage,opp:S.opp.name,gf,ga,pk:pens?pens.a+':'+pens.b:''});
  const cm=(COINM[S.diff||'normal']||1)*(S.daily?1:UPFX.coin(upLv('coin')));
  const R=x=>Math.round(x*cm),notes=[];
  S.streak=win?(S.streak||0)+1:0;
  let coins=R(win?60:draw?25:10)+gf*5;
  if(ga===0){coins+=R(15);notes.push('czyste konto +'+R(15));}
  if(gf-ga>=3){coins+=R(20);notes.push('pogrom +'+R(20));}
  if(win&&S.streak>=2){const b=R(Math.min(S.streak,5)*8);coins+=b;notes.push('seria '+S.streak+' +'+b);}
  let next='squad',msg=win?'Zwycięstwo':draw?'Remis':'Porażka';
  if(S.mode==='league'){
    leagueRound(gf,ga);S.stage++;
    if(S.league.round>=7){
      next='league';const pos=leaguePos();
      addStat('leagues',1);
      const lb=pos===1?250:pos===2?150:pos===3?90:30;
      if(pos===1)addStat('leagueTitles',1);
      coins+=R(lb);notes.push('liga: '+pos+'. miejsce +'+R(lb));
      msg+='. Koniec ligi: '+pos+'. miejsce';
    }
  }else if(S.stage<3){
    S.pts+=win?3:draw?1:0;S.stage++;
    if(S.stage===3){if(S.pts>=4){addStat('groups',1);coins+=R(50);notes.push('awans z grupy +'+R(50));msg+='. Awans z grupy ('+S.pts+' pkt)';}else{next='elim';msg+='. Odpadasz w grupie ('+S.pts+' pkt)';}}
  }else if(win){
    if(S.stage<5){const kb=[40,70][S.stage-3];coins+=R(kb);notes.push(STAGES[S.stage]+' +'+R(kb));}
    S.stage++;
    if(S.stage===6){next='champ';addStat('titles',1);coins+=R(300);notes.push('tytuł +'+R(300));msg='Mistrzostwo świata!';}
  }else{next='elim';msg+='. Odpadasz z turnieju';}
  P.coins=(P.coins||0)+coins;
  M.next=next;M.phase='done';
  if(next==='squad')S.opp=nextOpp();
  const v=$('#verdict');if(v)v.innerHTML='<div class="banner '+(win||draw?'win':'lose')+'" style="text-align:center;margin:8px 0">'+esc(msg)+'</div><div class="small mute" style="text-align:center">+'+coins+' monet</div>'+(notes.length?'<div class="small mute" style="text-align:center">'+esc(notes.join(' · '))+'</div>':'')+'';
  S.pendingNext=next;save();updateWallet();renderCtl();
}
function skipAll(){
  if(!M)return;
  for(let g=0;g<10&&M.phase!=='done';g++){
    const p=M.phase;
    if(p==='pre')runHalf(1);
    else if(p==='ht')runHalf(2);
    else if(p==='h1'||p==='h2')fastHalf();
    else if(p==='pens'){while(M.phase==='pens')penStep(rnd(3));}
    else if(p==='pens-done')finishMatch({a:M.pen.a,b:M.pen.b});
    else break;
  }
}

let MUTE=false,AC=null,WT=null,DR=null;
try{MUTE=localStorage.getItem('u11.mute')==='1';}catch(e){}
function ac(){
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}
  return AC;
}
function tone(f,d,type,vol,delay,slide){
  const a=ac();if(!a||MUTE)return;
  const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d,vol,f0,f1,delay){
  const a=ac();if(!a||MUTE)return;
  const t=a.currentTime+(delay||0),n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();
  s.buffer=buf;fl.type='bandpass';fl.Q.value=.8;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+d*.3);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t);
}
const SFX={
  pick(){tone(520,.08,'triangle',.1);},
  place(){tone(180,.14,'sine',.2,0,90);tone(660,.06,'triangle',.07,.02);},
  pack(){noise(.4,.1,300,2600);},
  goal(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.12,i*.09));noise(1.3,.08,400,1800,.1);},
  concede(){tone(240,.6,'sawtooth',.07,0,110);},
  whistle(){tone(2600,.16,'sine',.09);tone(2800,.32,'sine',.09,.2);},
  save(){tone(300,.12,'square',.05);},
  claim(){tone(880,.1,'triangle',.1);tone(1175,.2,'triangle',.1,.08);},
  tick(){tone(1500+Math.random()*300,.025,'square',.025);},
  flip(t){if(t==='icon')return;if(t==='toty'){tone(784,.25,'triangle',.1);tone(1175,.4,'triangle',.08,.08);}else if(t==='rare'||t==='wc'||t==='euro'){tone(660,.2,'triangle',.08);tone(990,.25,'triangle',.06,.06);}else tone(t==='gold'?520:380,.07,'triangle',.06);},
  icon(){[392,523,659,784].forEach(f=>tone(f,1.3,'sine',.07));tone(1568,.7,'triangle',.06,.3);noise(1,.07,200,3200);}
};
function sfx(k,a){try{if(SFX[k])SFX[k](a);}catch(e){}}

function hoverSlot(x,y){
  const el=document.elementFromPoint(x,y),sl=el&&el.closest?el.closest('.slot.ok'):null;

function startDrag(){
  if(!DR||DR.active||S.view!=='draft')return;
  const c=S.pack&&S.pack.cards[DR.i];
  if(!c||c.dup){DR=null;return;}
  DR.active=true;

  S.sel=DR.i;render();

  g.className='ghost card t-'+c.tier+' mini';g.innerHTML=inner(c,true);

function endDrag(drop){
  if(!DR)return;
  clearTimeout(DR.t);
  if(DR.active){
    const sl=drop?hoverSlot(DR.x,DR.y):null;
    if(DR.ghost)DR.ghost.remove();
    document.querySelectorAll('.slot.hov').forEach(s=>s.classList.remove('hov'));
    try{document.body.releasePointerCapture(DR.id);}catch(e){}
    window._noClick=true;setTimeout(()=>{window._noClick=false;},60);
    if(sl)placeCard(+sl.dataset.i);

/* ===== Tryby (liga, wyzwanie dnia), questy okresowe, osiągnięcia, sklep, historia ===== */
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekKey(d){
  d=d||new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+'-W'+String(Math.ceil(((t-y0)/864e5+1)/7)).padStart(2,'0');
}
function per(p){
  const key=p==='d'?ymd():weekKey();
  let o=P.per[p];if(!o||o.key!==key){o=P.per[p]={key:key,s:{},c:{}};}
  return o;
}
function addStat(k,n){
  P.stats[k]=(P.stats[k]||0)+n;
  ['d','w'].forEach(p=>{const o=per(p);o.s[k]=(o.s[k]||0)+n;});
}

function makeLeague(){
  const off=(DIFFO[S.diff]||0)+adapt(),names=[],teams=[];
  shuffle([73,75,77,79,81,83,85]).forEach(b=>{const t=genTeam(b+off,names);names.push(t.name);teams.push(t);});
  const row=(name,me)=>({me:!!me,name:name,pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  return {teams:teams,rows:[row('Ty',true)].concat(teams.map(t=>row(t.name))),round:0};
}
function leagueArr(r){const o=[];for(let k=0;k<7;k++)o.push(1+((k+r)%7));return [0].concat(o);}
function updRow(row,f,a){row.pl++;row.gf+=f;row.ga+=a;if(f>a){row.w++;row.pts+=3;}else if(f===a){row.d++;row.pts++;}else row.l++;}
function leagueRound(gf,ga){
  const L=S.league,arr=leagueArr(L.round),oi=arr[7];
  updRow(L.rows[0],gf,ga);updRow(L.rows[oi],ga,gf);
  for(let i=1;i<=3;i++){
    const a=arr[i],b=arr[7-i],r=simQuick(L.teams[a-1],L.teams[b-1]);
    updRow(L.rows[a],r[0],r[1]);updRow(L.rows[b],r[1],r[0]);
  }
  L.round++;
}
function sortedRows(rows){
  return (rows||S.league.rows).map((r,i)=>Object.assign({i:i},r)).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}
function leaguePos(){return sortedRows().findIndex(r=>r.me)+1;}
function tableHTML(rows){
  const t=sortedRows(rows);
  return '<div class="tbl"><div class="tr th"><span>#</span><span>Drużyna</span><span>M</span><span>Bramki</span><span>Pkt</span></div>'+

}
/* ----- wyzwanie dnia ----- */
function dailyInfo(){
  const date=ymd(),seed=hash('u11-'+date),keys=Object.keys(FORMS);
  return {date:date,seed:seed,f:keys[seed%keys.length]};
}
function startDaily(){
  const d=dailyInfo();
  freshRun(d.f,{daily:{date:d.date,seed:d.seed},mode:'cup',diff:'normal'});
}
function dailyScore(champ){
  const won=(S.hist||[]).filter(h=>h.stage>=3&&(h.gf>h.ga||(h.pk&&+h.pk.split(':')[0]>+h.pk.split(':')[1]))).length;
  const goals=(S.hist||[]).reduce((s,h)=>s+h.gf,0);
  const prog=S.pts>=4?200+won*150+(champ?150:0):S.pts*40;
  return Math.round((S.ovr0||0)*10)+prog+goals*5;
}
function endRun(n){
  if(S.recorded){S.view='end';return;}
  const end={champ:n==='champ'};let res;
  if(n==='league'){const pos=leaguePos();end.league={pos:pos,rows:JSON.parse(JSON.stringify(S.league.rows))};end.champ=pos===1;res='Liga: '+pos+'. miejsce';}
  else if(n==='champ')res='Mistrzostwo';
  else res=(S.stage===3&&S.pts<4)?'Odpadnięcie w grupie':'Odpadnięcie: '+STAGES[Math.min(S.stage,5)];
  end.res=res;
  if(S.daily){
    const score=dailyScore(n==='champ'),D=P.daily;
    if(D.date!==S.daily.date){D.date=S.daily.date;D.best=0;}
    D.best=Math.max(D.best||0,score);
    end.daily={score:score,date:S.daily.date,f:S.formation};
    if(D.rewarded!==S.daily.date){D.rewarded=S.daily.date;P.tok.year++;P.coins=(P.coins||0)+50;addStat('dailies',1);end.daily.bonus=true;}
    end.share='Ultimate 11 Draft '+S.daily.date+' · '+S.formation+' · skład '+(S.ovr0||0)+' OVR · wynik '+score+' ('+res+')';
  }
  S.end=end;S.view='end';S.recorded=true;
  P.hist=P.hist||[];
  P.hist.unshift({t:ymd(),mode:S.mode,diff:S.diff,daily:!!S.daily,f:S.formation,ovr:S.ovr0||0,res:res,sq:S.slots.map(s=>({n:s.card.n,pos:s.pos,o:s.card.ovr,t:s.card.tier,c:s.card.c,y:s.card.year}))});
  P.hist=P.hist.slice(0,10);
  save();
}

document.addEventListener('click',e=>{

  if(a==='quests'){openModal('q');}

  else if(a==='claim'){
    const q=QUESTS.find(x=>x.id===el.dataset.id);
    if(q&&!P.claimed[q.id]&&(P.stats[q.s]||0)>=q.t){P.claimed[q.id]=1;giveReward(q.r);sfx('claim');toast('Odebrano: '+rwText(q.r));updateWallet();save();openModal();}
  }else if(a==='pclaim'){
    const p=el.dataset.p,o=per(p),q=(p==='d'?DQ:WQ).find(x=>x.id===el.dataset.id);
    if(q&&!o.c[q.id]&&(o.s[q.s]||0)>=q.t){o.c[q.id]=1;giveReward(q.r);sfx('claim');toast('Odebrano: '+rwText(q.r));updateWallet();save();openModal();}
  }else if(a==='dbonus'){const o=per('d');if(dailyAll()&&!o.c.bonus){o.c.bonus=1;giveReward(DBONUS);sfx('claim');toast('Komplet dnia: '+rwText(DBONUS));updateWallet();save();openModal();}
  }else if(a==='ups'){openModal('u');
  }else if(a==='buyup'){
    const u=UPS.find(x=>x.k===el.dataset.k),l=u?upLv(u.k):0,c=u?upCost(u,l):0;
    if(u&&l<u.max&&(P.coins||0)>=c){P.coins-=c;P.up[u.k]=l+1;sfx('claim');toast(u.n+': poziom '+(l+1));updateWallet();save();openModal();}
  }else if(a==='buy'){
    const it=SHOP.find(x=>x.k===el.dataset.k);
    if(it&&(P.coins||0)>=it.c){
      P.coins-=it.c;
      if(it.k==='shard'){P.shards=(P.shards||0)+1;if(P.shards>=3){P.shards-=3;P.tok.year++;}}else P.tok[it.k]++;
      sfx('claim');toast('Kupiono: '+it.n);updateWallet();save();openModal();
    }
  }else if(a==='menu-go'){MENU.step=el.dataset.s;MENU.wipe=false;render();window.scrollTo({top:0});}
  else if(a==='pickmode'){P.pref.mode=el.dataset.v;MENU.step='form';render();window.scrollTo({top:0});}
  else if(a==='wipe'){
    if(!MENU.wipe){MENU.wipe=true;render();}
    else{try{localStorage.removeItem(KEY);}catch(err){}P=JSON.parse(JSON.stringify(P0));S={view:'menu'};MENU.step='home';MENU.wipe=false;render();toast('Postęp usunięty.');}
  }
  else if(a==='setmode'){P.pref.mode=el.dataset.v;render();}
  else if(a==='setdiff'){P.pref.diff=el.dataset.v;render();}
  else if(a==='daily'){startDaily();render();}
  else if(a==='share'){
    const txt=S.end&&S.end.share||'';
    const fb=()=>toast('Skopiuj tekst ręcznie.');
    try{navigator.clipboard.writeText(txt).then(()=>toast('Skopiowano wynik.'),fb);}catch(err){fb();}
  }
});

/* konfetti */
const FX={p:[],raf:0};
function confetti(x,y,n,spread){
  if(FASTA())return;
  const cv=$('#fx');if(!cv)return;
  if(cv.width!==innerWidth||cv.height!==innerHeight){cv.width=innerWidth;cv.height=innerHeight;}
  const cols=['#e9b949','#f4d878','#ffffff','#4fd18b','#ef6a5b','#6fb7ff'];
  for(let i=0;i<n;i++)FX.p.push({x:x,y:y,vx:(Math.random()-.5)*spread*1.6,vy:-Math.random()*9-3,r:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:70+Math.random()*60});
  if(!FX.raf)FX.raf=requestAnimationFrame(fxStep);
}
function fxStep(){
  const cv=$('#fx');if(!cv){FX.raf=0;return;}
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
  FX.p=FX.p.filter(p=>p.life>0&&p.y<cv.height+20);
  FX.p.forEach(p=>{p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.rot+=p.vr;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.life/25);ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
  if(FX.p.length)FX.raf=requestAnimationFrame(fxStep);else{FX.raf=0;ctx.clearRect(0,0,cv.width,cv.height);}
}

const TARGET=[72,74,76,79,82,85];
function genTeam(tt,exclude){
  for(let t=0;t<500;t++){
    const c=pick(CODES),y=MINY+rnd(MAXY-MINY+1);
    const pool=PLAYERS.filter(p=>p.c===c&&p.from<=y&&y<=p.to);
    if(pool.length<(t<300?7:3))continue;
    const name=COUNTRIES[c]+' '+y;
    if(exclude&&exclude.includes(name)&&t<450)continue;
    const sorted=pool.slice().sort((x,z)=>baseOvr(z,y,false)-baseOvr(x,y,false));
    const byG=g=>sorted.filter(p=>p.g===g);
    const lu=[].concat(byG('GK').slice(0,1),byG('DEF').slice(0,4),byG('MID').slice(0,3),byG('FWD').slice(0,3));
    const rest=sorted.filter(p=>!lu.includes(p));
    while(lu.length<11&&rest.length)lu.push(rest.shift());
    const avg=g=>{const a=lu.filter(p=>p.g===g).map(p=>baseOvr(p,y,false));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;};
    const t0=tt+rnd(3)-1,ln=g=>{const base=t0+rnd(5)-2,r=avg(g);return r==null?base:Math.round(.75*base+.25*r);};
    const o={gk:ln('GK'),def:ln('DEF'),mid:ln('MID'),att:ln('FWD')};
    o.ovr=(o.gk+o.def*4+o.mid*3+o.att*3)/11;
    o.name=name;o.c=c;
    o.stars=sorted.slice(0,3).map(p=>p.n);
    o.pool=pool.map(p=>p.n);
    o.lineup=lu.map(p=>({n:p.n,pos:p.pos,ovr:baseOvr(p,y,false)}));
    return o;
  }
}
const DIFFO={easy:-4.5,normal:0,hard:2.5},DIFFN={easy:'Łatwy',normal:'Normalny',hard:'Legenda'},COINM={easy:.7,normal:1,hard:1.6};
function adapt(){return S.daily?0:Math.max(-3,Math.min(4,(ratings(S.slots,false).ovr-83)*.5));}
function oppTarget(stage){return TARGET[stage]+(DIFFO[S.diff||'normal']||0)+adapt();}
function genOpp(stage){const f=()=>genTeam(oppTarget(stage));return S.daily?withRng(S.daily.seed+stage*104729+1,f):f();}
function nextOpp(){return S.mode==='league'?S.league.teams[(1+((6+S.league.round)%7))-1]:genOpp(S.stage);}
function isKO(){return S.mode!=='league'&&S.stage>=3;}
function stageName(i){return S.mode==='league'?'Kolejka '+(i+1)+'/7':STAGES[i];}
/* ----- akcje ----- */
function gain(c){
  const d={icons:c.tier==='icon'?1:0,totys:c.tier==='toty'?1:0,muts:c.mut?1:0,events:c.ev?1:0};
  for(const k in d)addStat(k,d[k]);
  return d;
}
function placeCard(i){
  const card=S.pack&&S.sel!=null?S.pack.cards[S.sel]:null,slot=S.slots[i];
  if(!card||!slot||slot.card||penalty(slot.pos,card)>=99)return false;
  if(dupOf(card)){toast('Ten zawodnik już jest w składzie.');return false;}
  const d=gain(card);S.last={pack:S.pack,slot:i,d};
  slot.card=card;card.dup=false;sfx('place');S.lastPlaced=i;
  if(S.slots.every(s=>s.card)){S.last=null;finishDraft();}else rollPack();
  render();window.scrollTo({top:0,behavior:'smooth'});return true;
}
function finishDraft(){
  const cc=countryCounts(S.slots);
  addStat('drafts',1);if(Math.max.apply(null,Object.values(cc))>=5&&!P.stats.chem5)addStat('chem5',1);
  const r=ratings(S.slots,false);P.best=Math.max(P.best,Math.round(r.ovr));
  S.view='squad';S.stage=0;S.pts=0;S.hist=[];S.sel=null;S.pack=null;
  if(S.mode==='league')S.league=makeLeague();
  S.opp=nextOpp();S.ovr0=Math.round(r.ovr*10)/10;
}
function freshRun(f,o){
  o=o||{};
  S={view:'draft',formation:f,mode:o.mode||P.pref.mode||'cup',diff:o.daily?'normal':(o.diff||P.pref.diff||'normal'),daily:o.daily||null,rr:0,slots:FORMS[f].map(a=>({pos:a[0],x:a[1],y:a[2],card:null})),pack:null,sel:null,stage:0,pts:0,hist:[]};
  if(S.daily)S.mode='cup';
  else{const st=UPFX.start(upLv('start'));if(P.tok.year<st)P.tok.year=st;}
  rollPack();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(window._noClick)return;
  const a=el.dataset.act,i=+el.dataset.i;
  const small=innerWidth<=820;
  switch(a){
    case'start':freshRun(el.dataset.f);break;
    case'selcard':sfx('pick');S.sel=i;render();if(small){const p=$('.pitch');if(p)p.scrollIntoView({behavior:'smooth',block:'center'});}return;
    case'place':placeCard(i);return;
    case'auto':{const card=S.pack&&S.sel!=null?S.pack.cards[S.sel]:null;if(!card)return;const bi=bestSlot(card);if(bi>=0)placeCard(bi);return;}
    case'dup':{
      const card=S.pack&&S.sel!=null?S.pack.cards[S.sel]:null;if(!card||!dupOf(card))return;
      S.pack.cards.splice(S.sel,1);S.sel=null;addStat('dups',1);P.shards=(P.shards||0)+1;
      if(P.shards>=3){P.shards-=3;P.tok.year++;toast('3 odłamki: +1 reroll roku');sfx('claim');}else toast('Odłamki: '+P.shards+'/3');
      if(!S.pack.cards.length){S.rr=(S.rr||0)+1;rollPack();}
      break;
    }
    case'undo':{
      if(S.daily){toast('W wyzwaniu dnia rerolle są wyłączone.');return;}
      if(!S.last||P.tok.year<1||S.view!=='draft')return;
      P.tok.year--;const L=S.last;S.slots[L.slot].card=null;
      ['icons','totys','muts','events'].forEach(k=>{addStat(k,-(L.d[k]||0));});
      S.pack=L.pack;S.sel=null;S.last=null;S.fresh=false;break;
    }
    case'mute':MUTE=!MUTE;try{localStorage.setItem('u11.mute',MUTE?'1':'0');}catch(e){}updateWallet();return;
    case'tokyear':case'tokall':{
      const k=a==='tokyear'?'year':'all';if(S.daily){toast('W wyzwaniu dnia rerolle są wyłączone.');return;}if(P.tok[k]<1||!S.pack)return;
      const p=genPack(needNow(),packOpts(k==='year'?{country:S.pack.country,avoidYear:S.pack.year}:{}));
      if(!p){toast('Brak innych lat dla tego kraju.');return;}
      P.tok[k]--;S.pack=p;S.sel=null;S.fresh=true;notePack(p);break;
    }
    case'reset':
      if(!S.confirmReset){S.confirmReset=true;render();setTimeout(()=>{if(S.confirmReset){S.confirmReset=false;render();}},3000);return;}
      S={view:'menu'};break;
    case'reset2':S={view:'menu'};break;
    case'selslot':if(S.swap)return;S.swapSel=S.swapSel===i?null:i;break;
    case'swapyear':case'swapall':{
      const k=a==='swapyear'?'year':'all',slot=S.slots[S.swapSel];
      if(S.daily){toast('W wyzwaniu dnia rerolle są wyłączone.');return;}
      if(!slot||P.tok[k]<1)return;
      const need=slot.pos==='GK'?{gk:true,field:false}:{gk:false,field:true};
      const p=genPack(need,packOpts(k==='year'?{country:slot.card.c,avoidYear:slot.card.year}:{}));
      if(!p){toast('Nie udało się wylosować paczki.');return;}
      P.tok[k]--;S.swap={pack:p};break;
    }
    case'swappick':{const slot=S.slots[S.swapSel],c=S.swap.pack.cards[i];slot.card=c;gain(c);S.swap=null;S.swapSel=null;break;}
    case'swapkeep':S.swap=null;break;
    case'play':startMatch();return;
    case'quick':startMatch();skipAll();return;
    case'next':{
      const n=S.pendingNext||'squad';S.pendingNext=null;
      if(n==='squad')S.view='squad';else endRun(n);
      break;
    }
    default:return;
  }
  render();
});
let LASTV=null;
function render(){
  clearRev();
  const h={menu:viewMenu,draft:viewDraft,squad:viewSquad,match:viewMatch,end:viewEnd}[S.view]||viewMenu;
  if(S.view!=='menu'){MENU.step='home';MENU.wipe=false;}
  document.body.dataset.v=S.view;
  const app=$('#app'),key=S.view+(S.view==='menu'?MENU.step:'');
  app.innerHTML=h();
  if(LASTV!==key){app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');LASTV=key;}
  S.lastPlaced=null;
  updateWallet();save();countUps();
  if(S.view==='draft')spin();
  if(S.view==='end')endFx();
}
load();
if(S.pendingNext&&S.pendingNext!=='squad')endRun(S.pendingNext);
S.pendingNext=null;
if(S.view==='draft'&&!S.pack)rollPack();
if(S.view==='squad'&&(!S.opp||!S.opp.lineup))S.opp=nextOpp();
if((S.view==='squad'||S.view==='draft')&&!S.slots)S={view:'menu'};
render();
</script>
